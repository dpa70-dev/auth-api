name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # El contrato es la fuente de verdad (SDD): `src/api/contract.ts` es un artefacto
      # GENERADO desde `docs/03-openapi.yaml`. Si el YAML cambia y el generado no, el
      # typecheck valida tipos de un contrato obsoleto y el drift pasa inadvertido.
      # Regenerar + diff contra el archivo versionado convierte ese drift en un fallo
      # de CI. Va antes del typecheck para reportar la causa raíz primero.
      - name: Contract drift
        run: |
          npm run contract
          git diff --exit-code -- src/api/contract.ts

      # Gates de calidad del proyecto (docs/00 §10): typecheck, lint y tests.
      - run: npm run typecheck
      - run: npm run lint

      - name: Tests
        run: npm test

      # Auditoría del árbol de PRODUCCIÓN: las dependencias dev no viajan al runtime.
      #
      # Única excepción dev conocida y aceptada: esbuild <=0.24.2, anidado bajo
      # drizzle-kit -> @esbuild-kit/esm-loader (loader ESM legacy). El advisory
      # GHSA-67mh-4wv8-2f99 afecta al dev-server HTTP de esbuild, no a su uso como
      # librería de build: drizzle-kit invoca la API de esbuild, no sirve un
      # servidor, y el esbuild que drizzle-kit usa de verdad es ^0.25.4 (fuera del
      # rango vulnerable). Forzar el fix instalaría drizzle-kit@0.18 (2021) y
      # arrastraría zod 3 junto a zod 4: daño mayor que el riesgo asumido.
      - run: npm audit --omit=dev --audit-level=high